const THEORY=[{"term":"Thaat / Mel","definition":"Raagon ka vargikaran karne ke liye maana gaya mool swar-samooh ya janak mel.","example":"Raag Bhup mein sab swar shuddh hain, phir bhi uska thaat Kalyan maana jata hai.","group":"Raag classification","id":"theory|Thaat / Mel"},{"term":"Vadi","definition":"Kisi raag ka sabse pramukh swar vadi kehlata hai; ise raag ka raja bhi kehte hain.","example":"Vadi swar par vishesh nyas ya zor diya ja sakta hai; sirf use baar-baar gaana zaroori nahin.","group":"Important swars","id":"theory|Vadi"},{"term":"Samvadi","definition":"Vadi ke baad raag ka doosra pramukh swar samvadi kehlata hai; ise raag ka mantri bhi kehte hain.","example":"Samvadi aksar vadi se chauthe ya paanchve swar ke antar par hota hai.","group":"Important swars","id":"theory|Samvadi"},{"term":"Anuvadi","definition":"Raag mein prayukt ve swar jo na vadi hain aur na samvadi, anuvadi kehlate hain.","example":"Ye swar raag ka swaroop banane mein sahayak hote hain.","group":"Important swars","id":"theory|Anuvadi"},{"term":"Vivadi","definition":"Aisa swar jo raag ke mukhya swaroop se mel nahin khata aur aam taur par usmein nahin liya jata.","example":"Kuch paramparaon mein vivadi swar ka bahut halka sparsh bhi sambhav hai.","group":"Important swars","id":"theory|Vivadi"},{"term":"Jaati","definition":"Raag ke aaroh aur avroh mein prayukt swaron ki sankhya ke aadhar par uski jaati tay hoti hai.","example":"Audav mein 5, Shadav mein 6 aur Sampurna mein 7 swar hote hain.","group":"Raag classification","id":"theory|Jaati"},{"term":"Saptak","definition":"Sa se Ni tak saat swaron ka samooh saptak kehlata hai.","example":"Mandra saptak neecha, Madhya beech ka aur Taar saptak ooncha hota hai.","group":"Pitch and sound","id":"theory|Saptak"},{"term":"Alankar","definition":"Swaron ko kisi nishchit kram ya rachna mein gaane ka abhyas alankar kehlata hai.","example":"Jaise: Sa Re Ga, Re Ga Ma, Ga Ma Pa.","group":"Practice and composition","id":"theory|Alankar"},{"term":"Gayan Samay","definition":"Parampara ke anusaar kisi raag ko gaane ka nirdharit samay uska gayan samay kehlata hai.","example":"Kuch raag din ke prahar mein aur kuch raat ke prahar mein gaaye jate hain.","group":"Raag classification","id":"theory|Gayan Samay"},{"term":"Varjit Swar","definition":"Jo swar kisi raag mein, ya uske aaroh athva avroh mein, nahin liya jata vah varjit swar hai.","example":"Bhup mein Ma aur Ni varjit hain; Bhimpalasi ke aaroh mein Re aur Dha varjit hain.","group":"Important swars","id":"theory|Varjit Swar"},{"term":"Dhwani","definition":"Kisi vastu ke kampan se utpann hone wali aawaz dhwani kehlati hai.","example":"Har dhwani ka sangeet mein upyog hona zaroori nahin.","group":"Pitch and sound","id":"theory|Dhwani"},{"term":"Naad","definition":"Sangeet ke yogya, niyamit kampan se utpann madhur aur pehchaani ja sakne wali dhwani ko naad kehte hain.","example":"Ek sthir Sa gaane par sangeet-yogya naad sunai deta hai.","group":"Pitch and sound","id":"theory|Naad"},{"term":"Swar","definition":"Aisa madhur, nishchit oonchai wala naad jo sangeet mein prayukt ho, swar kehlata hai.","example":"Saat mool swar hain: Sa Re Ga Ma Pa Dha Ni.","group":"Pitch and sound","id":"theory|Swar"},{"term":"Shruti","definition":"Sangeet mein sun kar pehchana ja sakne wala sookshm swar-antar shruti kehlata hai.","example":"Paramparik siddhant mein ek saptak ki 22 shrutiyan mani gayi hain.","group":"Pitch and sound","id":"theory|Shruti"},{"term":"Shuddh Swar","definition":"Swar ka saamanya ya mool roop shuddh swar kehlata hai.","example":"Sa, Re, Ga, Ma, Pa, Dha, Ni ke shuddh roop.","group":"Pitch and sound","id":"theory|Shuddh Swar"},{"term":"Komal Swar","definition":"Apne shuddh sthan se neeche liya gaya swar komal kehlata hai.","example":"Re, Ga, Dha aur Ni komal ho sakte hain; Sa aur Pa nahin.","group":"Pitch and sound","id":"theory|Komal Swar"},{"term":"Teevra Swar","definition":"Apne shuddh sthan se ooncha liya gaya Ma, teevra Ma kehlata hai.","example":"Hindustani sangeet ke 12 swaron mein keval Ma ka teevra roop hota hai.","group":"Pitch and sound","id":"theory|Teevra Swar"},{"term":"Aaroh","definition":"Raag mein neeche se oonche swaron ki or jaane ka vishisht kram aaroh kehlata hai.","example":"Aaroh mein kuch swar chhoot sakte hain ya vakra chal ho sakti hai.","group":"Raag movement","id":"theory|Aaroh"},{"term":"Avroh","definition":"Raag mein oonche se neeche swaron ki or aane ka vishisht kram avroh kehlata hai.","example":"Avroh ka aaroh ka bilkul ulta hona zaroori nahin.","group":"Raag movement","id":"theory|Avroh"},{"term":"Pakad","definition":"Raag ki pehchaan karane wala vishisht swar-samooh ya swar-chal pakad kehlata hai.","example":"Raag ki pehchaan swaron ke saath unke lagaav aur chal se hoti hai.","group":"Raag movement","id":"theory|Pakad"},{"term":"Bandish","definition":"Kisi raag aur taal mein bandhi hui nishchit swar-rachna ko bandish kehte hain.","example":"Bandish mein aksar sthayi aur antara hote hain.","group":"Practice and composition","id":"theory|Bandish"},{"term":"Lakshan Geet","definition":"Jis geet ke bolon mein raag ke lakshan bataye jaate hain, use lakshan geet kehte hain.","example":"Ismein raag ke swar, vadi-samvadi ya gayan samay bataya ja sakta hai.","group":"Practice and composition","id":"theory|Lakshan Geet"},{"term":"Sargam","definition":"Geet ke bolon ke sthan par swaron ke naam lekar gaana sargam kehlata hai.","example":"Jaise: Sa Re Ga Ma Pa Dha Ni.","group":"Practice and composition","id":"theory|Sargam"},{"term":"Taal","definition":"Matraon ke nishchit samooh ka baar-baar dohraaya jaane wala aavartan taal kehlata hai.","example":"Teentaal mein 16 matraen hoti hain: 4+4+4+4.","group":"Rhythm","id":"theory|Taal"},{"term":"Laya","definition":"Sangeet ki gati ko laya kehte hain.","example":"Vilambit laya dheemi, Madhya saamanya aur Drut tez hoti hai.","group":"Rhythm","id":"theory|Laya"},{"term":"Matra","definition":"Taal ki ginti ki ek ikai ko matra kehte hain.","example":"Teentaal mein kul 16 matraen hoti hain.","group":"Rhythm","id":"theory|Matra"},{"term":"Sam","definition":"Taal ke aavartan ki pehli aur sabse mahatvapurn matra sam kehlati hai.","example":"Teentaal ki pehli matra sam hai.","group":"Rhythm","id":"theory|Sam"},{"term":"Tali / Khali","definition":"Taal ke jis vibhaag par taali bajti hai vah tali hai; jahan haath se ishara kiya jata hai vah khali hai.","example":"Teentaal mein 1, 5, 13 par tali aur 9 par khali hoti hai.","group":"Rhythm","id":"theory|Tali / Khali"}];

function persist(){try{localStorage.setItem(STORE,JSON.stringify(saved))}catch(e){};if(window.raagCloud)window.raagCloud.onLocalWrite(saved)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pretty(s){return s[0].toUpperCase()+s.slice(1)}function rnd(a){return [...a].sort(()=>Math.random()-.5)}function sum(){let a=Object.values(saved);return {reviewed:a.filter(v=>v.attempts).length,mastered:a.filter(v=>v.streak>=3).length,due:a.filter(v=>v.attempts&&v.due<=Date.now()).length,attempts:a.reduce((s,v)=>s+(v.attempts||0),0)}}function rec(f){return saved[f.id]||{attempts:0,streak:0,due:0,correct:0}}function strength(f){let r=rec(f);return !r.attempts?0:Math.min(100,Math.round((r.streak/5)*100))}function record(f,yes){let r=rec(f);r.attempts++;r.correct=(r.correct||0)+(yes?1:0);r.streak=yes?r.streak+1:0;let mins=yes?[10,1440,4320,10080,20160,43200][Math.min(r.streak-1,5)]:.5;r.due=Date.now()+mins*60000;r.last=Date.now();saved[f.id]=r;persist()}

function home(){let s=sum();return `<div class="hero"><div><div class="label" style="color:#99d3c7">Personalized Hindustani vocal trainer</div><h1>Your raags, mastered one connection at a time.</h1><p>Explore your raags and music-theory definitions, then answer different kinds of questions. Struggling associations return sooner. Confident ones are spaced out.</p></div><button class="primary" onclick="state.scope='both';state.filterRaag='all';state.category='all';startTrain()">Start mixed training →</button></div><div class="stats"><div class="stat"><div class="label">Raag facts + theory concepts</div><b>${allFacts.length+THEORY.length}</b></div><div class="stat"><div class="label">Practiced</div><b>${s.reviewed}</b></div><div class="stat"><div class="label">Strong memories</div><b>${s.mastered}</b></div><div class="stat"><div class="label">Due for review</div><b>${s.due}</b></div></div><div class="grid"><section class="panel"><h2>Learn first, then retrieve</h2><p>Explore one raag's full profile and compare melodic shapes. When you're ready, train with multiple-choice, typed answers, identify-the-raag and select-all questions.</p><button onclick="setTab('learn')">Explore the 7 raags</button></section><section class="panel"><h2>Smart reinforcement</h2><p>The trainer prioritizes due facts and ones you've missed. Every correct response increases the time until review; a miss sends it back for near-term practice.</p><button onclick="setTab('theory')">Learn music theory</button><button onclick="setTab('progress')">See your weak areas</button></section></div>`}
// Chromatic swar mapping: Sa=C#4, 12 positions per octave.
const SWARS=[['Sa','C#'],['re♭','D'],['Re','D#'],['ga♭','E'],['Ga','F'],['Ma','F#'],['Ma♯','G'],['Pa','G#'],['dha♭','A'],['Dha','A#'],['ni♭','B'],['Ni','C']];
const SWAR_NAMES=['sa','re','ga','ma','pa','dha','ni'];
function swarIndex(n,flat=false,sharp=false){const base={sa:0,re:2,ga:4,ma:5,pa:7,dha:9,ni:11}[n];return base===undefined?-1:base+(flat?-1:sharp?1:0)}
function tokenizeSwars(str){
 const terms=(str||'').toLowerCase().replace(/[,;|]/g,' ').split(/\s+/).filter(Boolean);
 let out=[];
 for(const raw of terms){
   // Swars can use either order: ni._ and ni_. both mean komal Ni in mandra saptak.
   const m=raw.match(/^(sa|re|ga|ma|pa|dha|ni)([_.#^]*)$/);
   if(!m)continue;
   const n=m[1],marks=m[2];
   const flat=marks.includes('_')&&n!=='ma';
   const sharp=(marks.includes('#')||marks.includes('^'))&&n==='ma';
   const oct=marks.includes('.')?-1:0;
   const idx=swarIndex(n,flat,sharp);
   if(idx>=0)out.push({n,idx,oct,label:raw});
 }
 return out;
}
function raagPalette(r){
 const lines=[...tokenizeSwars(r.aaroh),...tokenizeSwars(r.avroh),...tokenizeSwars(r.pakad)];
 const used=new Set(lines.map(x=>`${x.oct}:${x.idx}`));
 // Aaroh generally ends in taar Sa, and avroh begins there; distinguish it from madhya Sa.
 const aar=tokenizeSwars(r.aaroh),avr=tokenizeSwars(r.avroh);
 if(aar.length&&aar[aar.length-1].idx===0)used.add('1:0');
 if(avr.length&&avr[0].idx===0)used.add('1:0');
 // Explicit swar statements describe variants, not automatically each octave.
 // In Des and Khamaj, shuddh Ni is represented in aaroh and komal Ni in avroh.
 const excluded=new Set();
 const v=(r['varjit swar']||'').toLowerCase().trim();
 if(v&&!v.startsWith('aaroh:')&&v!=='-')for(const note of tokenizeSwars(v))excluded.add(note.idx);
 return {used,excluded,lines};
}
function swarKey(r,idx,oct=0,playing=-1){let pal=raagPalette(r),[name,western]=SWARS[idx],classes=['swar-key'];if(pal.excluded.has(idx))classes.push('varjit');else if(pal.used.has(`${oct}:${idx}`))classes.push('used');let vs=(r['vadi - samwadi']||'').split('-').map(x=>x.trim().toLowerCase());let primary=vs[0],secondary=vs[1];const pitchFor=(s)=>{const m=(s||'').match(/^(sa|re|ga|ma|pa|dha|ni)([_#^]?)$/);return m?swarIndex(m[1],m[2]==='_',m[2]==='#'||m[2]==='^'):-1};if(primary&&pitchFor(primary)===idx)classes.push('vadi');if(secondary&&pitchFor(secondary)===idx)classes.push('samvadi');if(idx===playing)classes.push('playing');return `<div class="${classes.join(' ')}" title="${name} = ${western}${oct===-1?' (lower)':oct===1?' (upper)':''}"><strong>${oct<0?'̣':oct>0?'̇':''}${name}</strong><small>${western}${oct===-1?'3':oct===1?'5':'4'}</small></div>`}
function seqView(r,k){let notes=tokenizeSwars(r[k]);return `<div class="visual-title">${k==='pakad'?'Pakad / signature phrase':k==='aaroh'?'Aaroh / ascent':'Avroh / descent'}</div><div class="sequence" id="seq_${k.replace(/ /g,'_')}">${notes.map((n,i)=>`<span title="${SWARS[n.idx]?.[1]||''}">${esc(n.label)}</span>`).join('')}</div><div class="quiet">${esc(r[k]||'Not provided')}</div>`}
function raagClockInfo(r){const g=(r['gayan samay']||'').toLowerCase();if(g.includes('raat pratham'))return {periods:[{part:'PM',start:6,end:9}],label:'Approx. 6–9 PM'};if(g.includes('raat dusra'))return {periods:[{part:'PM',start:9,end:12}],label:'Approx. 9 PM–midnight'};if(g.includes('din teesra'))return {periods:[{part:'PM',start:0,end:3}],label:'Approx. noon–3 PM'};if(g.includes('madhya ratri'))return {periods:[{part:'PM',start:11,end:12},{part:'AM',start:0,end:1}],label:'Around midnight (illustrative 11 PM–1 AM)'};return {periods:[],label:r['gayan samay']||'Not provided'}}
function dialHtml(part,periods){const wedges=[];for(let q=0;q<48;q++){const h=q/4,active=periods.some(p=>p.part===part&&h>=p.start&&h<p.end);wedges.push(`${active?'#369e78':'#e9f0ed'} ${q*7.5}deg ${(q+1)*7.5}deg`)}return `<div class="dial-block"><div class="dial-label">${part}</div><div class="dial" style="background:conic-gradient(${wedges.join(',')})"><span class="dial-hour twelve">12</span><span class="dial-hour three">3</span><span class="dial-hour six">6</span><span class="dial-hour nine">9</span><span class="dial-center">${part}</span></div></div>`}
function swarVisual(r){let special=r.Raag==='bhimpalasi'||r.Raag==='bageshri';let indicesLow=special?[7,8,9,10,11]:[7,9,10,11],hi=[0,1,2,3,4];let g=(r['gayan samay']||'').toLowerCase();let label=g.includes('din teesra')?'Day — third prahar (approximately noon–3 PM)':g.includes('raat pratham')?'Night — first prahar (approximately 6–9 PM)':g.includes('raat dusra')?'Night — second prahar (approximately 9 PM–midnight)':g.includes('madhya ratri')?'Around midnight':r['gayan samay'];return `<div class="swar-board"><div class="label">Raag swar map · Sa = C#</div><p class="quiet">12 chromatic swars, plus lower and upper octave notes. Green = used in this octave; red = explicitly varjit swar variant; gray = other unused notes. Gold border = vadi, dashed blue = samvadi. Sequence details are shown below.</p><div class="octave-title">Mandra saptak · lower octave</div><div class="octave-mini">${indicesLow.map(i=>swarKey(r,i,-1)).join('')}</div><div class="octave-title">Madhya saptak · all 12 swars</div><div class="swar-grid">${SWARS.map((_,i)=>swarKey(r,i)).join('')}</div><div class="octave-title">Taar saptak · upper octave</div><div class="octave-mini">${hi.map(i=>swarKey(r,i,1)).join('')}</div><div class="legend"><span><i style="background:#d5f4e5"></i>Present</span><span><i style="background:#f5e9e8"></i>Varjit</span><span><i style="border:2px solid #bc8629"></i>Vadi</span><span><i style="border:2px dashed #6388c2"></i>Samvadi</span></div>${seqView(r,'aaroh')}${seqView(r,'avroh')}${seqView(r,'pakad')}<div class="note" style="margin-top:12px">Aaroh-only varjit swars may still appear in avroh. Komal vs shuddh Ni is shown separately for raags using both variants. The map follows your spreadsheet, not a universal prescription.</div></div><div class="grid" style="margin-top:15px"><div class="panel"><div class="label">Gayan samay · AM and PM</div><div class="dual-clocks">${dialHtml('AM',raagClockInfo(r).periods)}${dialHtml('PM',raagClockInfo(r).periods)}</div><div class="clock-highlight">${esc(raagClockInfo(r).label)}<div class="quiet">Sheet: ${esc(r['gayan samay'])}</div><div class="quiet">Clock highlights are approximate conventional prahar windows.</div></div></div><div class="panel"><h2>Core associations</h2><div class="lesson" style="grid-template-columns:1fr"><div class="fact"><small>Vadi – Samvadi</small><strong>${esc(r['vadi - samwadi'])}</strong></div><div class="fact"><small>Varjit swar</small><strong>${esc(r['varjit swar'])}</strong></div><div class="fact"><small>Thaat · Jaati</small><strong>${esc(r.thaat)} · ${esc(r.jaati)}</strong></div></div></div></div>`}
function cycleRaag(direction){const index=DATA.findIndex(x=>x.Raag===state.raag);state.raag=DATA[(index+direction+DATA.length)%DATA.length].Raag;render()}
function learn(){let r=DATA.find(x=>x.Raag===state.raag);return `<section class="panel"><div class="label">Explore raags</div><h1 style="font-size:34px;margin:6px 0">Raag ${pretty(r.Raag)}</h1><div class="raag-picker"><label for="raagSel">Choose a raag:</label><select id="raagSel" aria-label="Choose raag">${DATA.map(x=>`<option value="${x.Raag}" ${x.Raag===state.raag?'selected':''}>${pretty(x.Raag)}</option>`).join('')}</select><button type="button" aria-label="Previous raag" onclick="cycleRaag(-1)">← Previous</button><button type="button" aria-label="Next raag" onclick="cycleRaag(1)">Next →</button></div>${swarVisual(r)}<h2 style="margin-top:25px">Full cheatsheet</h2><div class="lesson">${KEYS.map(k=>`<div class="fact"><small>${SHORT[k]}</small><strong>${esc(r[k]||'Not provided')}</strong></div>`).join('')}</div>${r['Style/Chalan']?`<p class="note">Style / Chalan: ${esc(r['Style/Chalan'])}</p>`:''}<div style="margin-top:20px"><button class="primary" onclick="state.scope='raag';state.category='all';startTrain('${r.Raag}')">Practice ${pretty(r.Raag)} →</button></div></section>`}

function filters(){return `<div class="topline"><div><h2 style="margin:0 0 5px">Adaptive training</h2><div class="quiet">Build recall, not just recognition</div></div><div class="flex"><select id="filterScope"><option value="both" ${state.scope==='both'?'selected':''}>Raags + theory</option><option value="raag" ${state.scope==='raag'?'selected':''}>Raag facts only</option><option value="theory" ${state.scope==='theory'?'selected':''}>Theory only</option></select><select id="filterRaag" ${state.scope==='theory'?'disabled':''}><option value="all">All raags</option>${DATA.map(x=>`<option value="${x.Raag}" ${state.filterRaag===x.Raag?'selected':''}>${pretty(x.Raag)}</option>`).join('')}</select><select id="filterCategory" ${state.scope==='theory'?'disabled':''}><option value="all">All associations</option>${KEYS.map(k=>`<option value="${k}" ${state.category===k?'selected':''}>${SHORT[k]}</option>`).join('')}</select></div></div>`}
function pool(){let r=state.scope==='theory'?[]:allFacts.filter(f=>(!state.filterRaag||state.filterRaag==='all'||f.r===state.filterRaag)&&(state.category==='all'||f.k===state.category));let t=state.scope==='raag'?[]:THEORY.filter(x=>state.scope==='theory'||(state.filterRaag==='all'&&state.category==='all'));return [...r,...t]}
function startTrain(raag){if(raag)state.filterRaag=raag;state.tab='train';state.started=true;state.ended=false;state.idx=0;state.correct=0;state.seen=0;state.session=[];document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab==='train'));nextQuestion()}
function pickFact(){let p=pool();if(!p.length)return null;let used=new Set(state.session.slice(-Math.min(5,state.session.length)).map(x=>x.f?.id));let due=p.filter(f=>rec(f).attempts&&rec(f).due<=Date.now()&&!used.has(f.id));let unseen=p.filter(f=>!rec(f).attempts&&!used.has(f.id));let other=p.filter(f=>!used.has(f.id));let batch=due.length?due:unseen.length?unseen:other.length?other:p;batch.sort((a,b)=>strength(a)-strength(b));return rnd(batch.slice(0,Math.max(1,Math.ceil(batch.length/2))))[0]}
function normalize(x){return String(x).toLowerCase().replace(/[^a-z0-9]/g,'').replace(/shuddh/g,'shudh').replace(/odav/g,'odhaw')}
function makeQ(f){if(f.term){let reverse=state.seen%3!==0;let typing=state.seen%3===2;let distract=rnd(THEORY.filter(t=>t.id!==f.id&&t.group===f.group));if(distract.length<3)distract=rnd(THEORY.filter(t=>t.id!==f.id));return {f,mode:typing?'type':'mcq',theory:true,correct:reverse?f.term:f.definition,question:reverse?(typing?'Type the music-theory term for this definition: '+f.definition:'Which music-theory term matches this definition? '+f.definition):'What does “'+f.term+'” mean?',options:typing?[]:rnd([f,...distract.slice(0,3)]).map(t=>reverse?t.term:t.definition)}}let other=allFacts.filter(x=>x.k===f.k&&x.id!==f.id&&x.v&&x.v!==f.v);let rs=DATA.filter(r=>r[f.k]&&r[f.k]!=='-');let mode= ['mcq','type','reverse','multi'][state.seen%4];let q={f,mode,correct:f.v};if(mode==='reverse'&&rs.filter(r=>r[f.k]===f.v).length!==1)mode='mcq';if(mode==='multi'&&(rs.length<3||new Set(rs.map(r=>r[f.k])).size<2))mode='mcq';q.mode=mode;
if(mode==='reverse'){q.question=`Which raag has ${SHORT[f.k].toLowerCase()} “${f.v}”?`;q.correct=pretty(f.r);q.options=rnd([pretty(f.r),...rnd(DATA.filter(r=>r.Raag!==f.r)).slice(0,3).map(r=>pretty(r.Raag))]);}
else if(mode==='multi'){let selected=rs.filter(r=>r[f.k]===f.v).map(r=>pretty(r.Raag));q.question=`Select ALL raags with ${SHORT[f.k].toLowerCase()} “${f.v}”.`;q.correct=selected;q.options=rnd(rs.map(r=>pretty(r.Raag))).slice(0,Math.max(4,Math.min(7,rs.length)));selected.forEach(x=>{if(!q.options.includes(x))q.options[rnd(q.options)[0]?0:0]=x});}
else {q.question=`${SHORT[f.k]} of Raag ${pretty(f.r)}?`;if(mode==='mcq'){let alternatives=[...new Set(other.map(x=>x.v))].filter(x=>x!==f.v);q.options=rnd([f.v,...rnd(alternatives).slice(0,3)]);if(q.options.length<2)q.mode='type';}}
return q}
function nextQuestion(){if(state.seen>=15){state.q=null;state.ended=true}else{let f=pickFact();state.q=f?makeQ(f):null;state.ended=!f;state.answered=false;state.selected=[];state.text='';state.hint=false;state.session.push({f:state.q?.f})}render()}
function answer(){let q=state.q;if(!q||state.answered)return;let yes=q.mode==='multi'?q.correct.length===state.selected.length&&q.correct.every(v=>state.selected.includes(v)):normalize(q.mode==='type'?state.text:state.selected[0])===normalize(q.correct);state.answered=true;state.correct+=yes?1:0;state.seen++;record(q.f,yes);render()}

function progress(){let s=sum();let sorted=[...allFacts].sort((a,b)=>strength(a)-strength(b));return `<div class="stats"><div class="stat"><div class="label">Total facts and concepts</div><b>${allFacts.length+THEORY.length}</b></div><div class="stat"><div class="label">Reviewed at least once</div><b>${s.reviewed}</b></div><div class="stat"><div class="label">Strong</div><b>${s.mastered}</b></div><div class="stat"><div class="label">Answers submitted</div><b>${s.attempts}</b></div></div><div class="grid"><div class="panel"><h2>Mastery by raag</h2>${DATA.map(r=>{let fs=allFacts.filter(f=>f.r===r.Raag);let v=Math.round(fs.reduce((s,f)=>s+strength(f),0)/fs.length);return `<div class="topic"><div style="width:105px;font-weight:650">${pretty(r.Raag)}</div><div class="bar"><div style="width:${v}%"></div></div><div class="quiet" style="width:37px;text-align:right">${v}%</div></div>`}).join('')}</div><div class="panel"><h2>Weakest raag associations</h2><table class="table"><tr><th>Raag</th><th>Attribute</th><th>Strength</th></tr>${sorted.slice(0,12).map(f=>`<tr><td>${pretty(f.r)}</td><td>${esc(SHORT[f.k])}</td><td>${strength(f)}%</td></tr>`).join('')}</table></div><div class="panel"><h2>Music theory mastery</h2>${THEORY.map(t=>`<div class="topic"><div style="min-width:145px;font-weight:600">${esc(t.term)}</div><div class="bar"><div style="width:${strength(t)}%"></div></div><div class="quiet">${strength(t)}%</div></div>`).join('')}</div></div><p class="note" style="margin-top:18px">This is a transparent simplified spaced-review model, not Membean's proprietary memory algorithm. Strength measures current review streak, not a scientifically calibrated probability of recall.</p><div class="flex"><button onclick="if(confirm('Clear all saved practice progress on this browser?')){saved={};persist();render()}">Reset practice history</button><button class="primary" onclick="startTrain()">Practice now</button></div>`}
function render(){const account=document.getElementById('accountBar');if(account&&window.raagCloud?.connected)account.style.display=state.tab==='progress'?'flex':'none';document.getElementById('content').innerHTML=state.tab==='theory'?theoryLearn():state.tab==='home'?home():state.tab==='learn'?learn():state.tab==='train'?quiz():progress();let rr=document.getElementById('raagSel');if(rr)rr.onchange=e=>{state.raag=e.target.value;render()};let fs=document.getElementById('filterScope');if(fs)fs.onchange=e=>{state.scope=e.target.value;render()};let fr=document.getElementById('filterRaag');if(fr)fr.onchange=e=>{state.filterRaag=e.target.value;render()};let fc=document.getElementById('filterCategory');if(fc)fc.onchange=e=>{state.category=e.target.value;render()};let ii=document.getElementById('answerInput');if(ii){ii.oninput=e=>state.text=e.target.value;ii.onkeydown=e=>{if(e.key==='Enter'){state.text=e.target.value;answer()}}}}
function theoryLearn(){let groups=['all',...new Set(THEORY.map(x=>x.group))];let rows=THEORY.filter(t=>(state.theoryGroup==='all'||t.group===state.theoryGroup)&&[t.term,t.definition,t.example].join(' ').toLowerCase().includes(state.theoryQuery.toLowerCase()));return `<div class="panel"><div class="topline"><div><div class="label">Music theory encyclopedia</div><h2 style="margin:5px 0">Learn the language of Hindustani music</h2><p class="quiet">Definitions, examples and connections before recall practice.</p></div><button class="primary" onclick="beginTheory()">Practice definitions →</button></div><div class="flex" style="margin:14px 0"><select id="theoryGroup">${groups.map(g=>`<option ${state.theoryGroup===g?'selected':''} value="${esc(g)}">${g==='all'?'All topics':esc(g)}</option>`).join('')}</select><input id="theorySearch" class="input" style="max-width:360px" placeholder="Find a concept…" value="${esc(state.theoryQuery)}"></div><div class="lesson">${rows.map(t=>`<div class="fact" style="display:block"><small>${esc(t.group)} · ${strength(t)}% mastery</small><h3 style="margin:7px 0">${esc(t.term)}</h3><p>${esc(t.definition)}</p><p class="quiet"><b>Remember it:</b> ${esc(t.example)}</p><button onclick='practiceTerm(${JSON.stringify(t.term)})'>Practice this concept</button></div>`).join('')}</div>${!rows.length?'<p>No matching concepts.</p>':''}</div>`}
function theoryItems(){return THEORY.filter(t=>state.theoryGroup==='all'||t.group===state.theoryGroup)}
function beginTheory(term){state.scope='theory';state.filterRaag='all';state.category='all';startTrain()}
function practiceTerm(term){beginTheory(term)}
function nextTheory(){let base=state.theoryTerm?THEORY.filter(t=>t.term===state.theoryTerm):theoryItems();let used=new Set(state.theorySession.slice(-5).map(x=>x.id));let ordered=base.filter(t=>!used.has(t.id)).sort((a,b)=>{let A=rec(a),B=rec(b);return ((A.attempts&&A.due<=Date.now())?-2:!A.attempts?-1:strength(a)/100)-((B.attempts&&B.due<=Date.now())?-2:!B.attempts?-1:strength(b)/100)});let t=ordered[0]||base[0];if(!t)return;let reverse=state.theoryIndex%3===1,typing=state.theoryIndex%3===2;let distract=rnd(THEORY.filter(x=>x.term!==t.term&&x.group===t.group));if(distract.length<3)distract=rnd(THEORY.filter(x=>x.term!==t.term));state.theoryQ={t,reverse,typing,options:rnd([t,...distract.slice(0,3)]).map(x=>reverse?x.term:x.definition)};state.theoryAnswered=false;state.theoryChoice='';state.theoryText='';state.theorySession.push(t);render()}
function theoryAnswer(val){if(state.theoryAnswered)return;let q=state.theoryQ;let ans=q.reverse?q.t.term:q.t.definition;let yes=q.typing?normalize(val)===normalize(q.t.term):val===ans;record(q.t,yes);state.theoryAnswered=true;state.theoryYes=yes;state.theoryScore+=yes?1:0;render()}
function theoryTrain(){if(!state.theoryQ)return `<div class="panel"><h2>Theory practice</h2><p>Recall definitions, identify terms and reinforce weak areas.</p><button class="primary" onclick="beginTheory()">Start training</button></div>`;if(state.theoryIndex>=15)return `<div class="panel"><h1>Session complete: ${state.theoryScore}/15</h1><button class="primary" onclick="beginTheory()">Train again</button><button onclick="setTab('theory')">Review concepts</button></div>`;let q=state.theoryQ,t=q.t,r=rec(t),answer=q.reverse||q.typing?t.term:t.definition;return `<div class="panel quizbox"><div class="topline"><span class="tag">${q.typing?'Typed recall':q.reverse?'Name the concept':'Match the definition'}</span><span class="quiet">Question ${state.theoryIndex+1} / 15</span></div><div class="progress"><div style="width:${state.theoryIndex/15*100}%"></div></div><div class="question">${q.reverse?'Which term means: '+esc(t.definition):q.typing?'Type the music-theory term: '+esc(t.definition):'What does “'+esc(t.term)+'” mean?'}</div>${q.typing?`<input id="theoryInput" class="input" placeholder="Type the term" ${state.theoryAnswered?'disabled':''}><button class="primary" ${state.theoryAnswered?'disabled':''} onclick="theoryAnswer(document.getElementById('theoryInput').value)">Check answer</button>`:q.options.map(o=>`<button class="choice ${state.theoryAnswered&&o===answer?'correct':''} ${state.theoryAnswered&&state.theoryChoice===o&&o!==answer?'wrong':''}" ${state.theoryAnswered?'disabled':''} onclick='state.theoryChoice=${JSON.stringify(o)};theoryAnswer(${JSON.stringify(o)})'>${esc(o)}</button>`).join('')}${state.theoryAnswered?`<div class="feedback ${state.theoryYes?'':'bad'}"><b>${state.theoryYes?'Correct!':'Not quite — review this concept.'}</b><p><b>${esc(t.term)}</b>: ${esc(t.definition)}</p><p><b>Example:</b> ${esc(t.example)}</p><div class="quiet">${strength(t)}% mastery · ${r.attempts} attempts</div></div><button class="primary" onclick="state.theoryIndex++;if(state.theoryIndex>=15){render()}else{nextTheory()}">Next question →</button>`:''}<div class="divider"></div><button onclick="setTab('theory')">Explore all definitions</button></div>`}
// Event delegation keeps input behavior predictable after re-rendering.
document.addEventListener('change',e=>{if(e.target.id==='theoryGroup'){state.theoryGroup=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='theorySearch'){state.theoryQuery=e.target.value;let pos=e.target.selectionStart;render();let el=document.getElementById('theorySearch');if(el){el.focus();el.setSelectionRange(pos,pos)}}});
document.addEventListener('keydown',e=>{if(e.target.id==='theoryInput'&&e.key==='Enter')theoryAnswer(e.target.value)});
render();</script><script>(function(){
 const el=document.getElementById('accountBar'),cfg=window.RAAGLAB_FIREBASE_CONFIG;
 let db=null,secret='',pin='',unsub=null,ready=false,remote={},pending=false,timer=null,busy=false;
 const configured=cfg&&cfg.apiKey&&!cfg.apiKey.startsWith('PASTE_')&&cfg.projectId&&!cfg.projectId.startsWith('PASTE_');
 const get=(k)=>localStorage.getItem('raaglab.sync.'+k)||'';
 const put=(k,v)=>localStorage.setItem('raaglab.sync.'+k,v);
 function info(s){const e=el.querySelector('.status');if(e)e.textContent=s}
 function newKey(){const b=new Uint8Array(24);crypto.getRandomValues(b);return [...b].map(x=>x.toString(16).padStart(2,'0')).join('')}
 function syncUrl(){return location.origin+location.pathname+'#sync='+secret}
 function show(){
   if(!configured){el.innerHTML='<span class="status">Set up Firebase to enable cloud sync. Local practice still works.</span>';return}
   if(!secret){el.innerHTML='<div class="login"><input id="pinNew" type="password" inputmode="numeric" maxlength="4" placeholder="Choose a 4-digit PIN" aria-label="Choose PIN"><button class="primary" id="makeSync">Create private sync space</button><button id="joinSync">Connect existing device</button></div><span class="status">No email needed. PIN is a local convenience lock; the private device-link key grants cloud access.</span>';document.getElementById('makeSync').onclick=()=>{let x=document.getElementById('pinNew').value;if(!/^\d{4}$/.test(x)){info('Enter exactly four digits.');return}pin=x;put('pin',x);secret=newKey();put('key',secret);start()};document.getElementById('joinSync').onclick=join;return}
   if(pin!==get('pin')){el.innerHTML='<div class="login"><input id="unlockPin" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN"><button class="primary" id="unlock">Unlock</button></div><span class="status">Enter your local PIN to unlock this device.</span>';document.getElementById('unlock').onclick=()=>{let v=document.getElementById('unlockPin').value;if(v===get('pin')){pin=v;start()}else info('Incorrect PIN')};return}
   el.innerHTML='<span class="status">☁ Connected · syncing progress</span><button id="linkDevice">Link iPhone / laptop</button><button id="lockDevice">Lock</button>';el.style.display=state.tab==='progress'?'flex':'none';
   document.getElementById('linkDevice').onclick=()=>{let u=syncUrl();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(u).then(()=>alert('Private sync link copied. Open it on your other device. Anyone with this link can access your progress.'));else prompt('Copy this private one-time setup link:',u)};
   document.getElementById('lockDevice').onclick=()=>{window.raagCloud.connected=false;el.style.display='flex';pin='';if(unsub){unsub();unsub=null}ready=false;show()};
 }
 function join(){let key=prompt('Paste the private sync key (48 hexadecimal characters) from your other device:');if(key===null)return;key=key.trim().replace(/^.*#sync=/,'');if(!/^[0-9a-f]{48}$/i.test(key)){info('Invalid sync key');return}let x=prompt('Choose a 4-digit PIN for this device:');if(!/^\d{4}$/.test(x||'')){info('PIN must have 4 digits');return}secret=key.toLowerCase();pin=x;put('key',secret);put('pin',pin);start()}
 function start(){if(!db){show();return}window.raagCloud.connected=true;show();if(unsub){unsub();unsub=null}ready=false;
  const ref=db.collection('privateSync').doc(secret);
  unsub=ref.onSnapshot(snap=>{const cloud=snap.exists?(snap.data().progress||{}):{};
   if(!ready){const merged={...saved,...cloud};let need=JSON.stringify(merged)!==JSON.stringify(cloud);saved=merged;ready=true;localStorage.setItem(STORE,JSON.stringify(saved));render();if(need)queue();else info('☁ All progress synced')}
   else if(!pending){saved={...saved,...cloud};localStorage.setItem(STORE,JSON.stringify(saved));render();info('☁ All progress synced')}
  },err=>info('Sync issue: '+err.message+' · local progress saved'));
 }
 function queue(){if(!secret||!ready||pin!==get('pin'))return;pending=true;clearTimeout(timer);timer=setTimeout(async()=>{if(busy)return;busy=true;try{await db.collection('privateSync').doc(secret).set({progress:saved,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});pending=false;info('☁ All progress synced')}catch(e){info('Sync failed: '+e.message+' · local data saved')}finally{busy=false}},600)}
 window.raagCloud={onLocalWrite:queue};
 document.getElementById('exportProgress').onclick=()=>{let blob=new Blob([JSON.stringify(saved,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='raaglab-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
 document.getElementById('importProgress').onclick=()=>document.getElementById('progressFile').click();
 document.getElementById('progressFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!obj||Array.isArray(obj)||typeof obj!=='object')throw Error('Invalid progress file');if(!confirm('Import these records?'))return;saved={...saved,...obj};persist();render();info('Imported progress')}catch(err){alert(err.message)}e.target.value=''};
 if(configured){try{firebase.initializeApp(cfg);db=firebase.firestore();}catch(e){info('Firebase setup issue: '+e.message)}}
 secret=get('key');let hash=location.hash.match(/^#sync=([0-9a-f]{48})$/i);if(hash){secret=hash[1].toLowerCase();put('key',secret);history.replaceState(null,'',location.pathname+location.search);pin='';put('pin',''); // Prompt device-local PIN after accepting the pairing link
 let p=prompt('Set a 4-digit PIN for this device:');if(/^\d{4}$/.test(p||'')){put('pin',p);pin=p}else{pin='';}}
 show();if(secret&&pin&&db)start();
})();</script></body></html>
